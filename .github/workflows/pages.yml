# Publishes the app to GitHub Pages on every push to main, or by hand from the Actions tab,
# through the sites' shared workflow (AriaMoKr/common, .github/workflows/pages.yml, on Node 24):
# npm ci, the unit tests, then `npm run build` (vite build, then the service worker), and dist/
# is deployed. To take a new version of the shared workflow, move the tag after @.
#
# One-time setup: the repository's Settings → Pages → Build and deployment → Source: GitHub Actions
# (or: gh api -X POST repos/AriaMoKr/arbuild/pages -f build_type=workflow).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: AriaMoKr/common/.github/workflows/pages.yml@v0.8.3
    with:
      build: npm run build
      path: dist
